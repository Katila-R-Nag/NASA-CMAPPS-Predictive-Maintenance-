apiVersion: 1

datasources:
  - name: CMAPSS Warehouse
    uid: cmapss-warehouse
    type: grafana-postgresql-datasource
    access: proxy
    # Container-to-container: use the compose service name and the INTERNAL
    # port (5432), not the 5433 you use from Windows.
    url: warehouse:5432
    user: cmapss
    isDefault: true
    jsonData:
      database: cmapss
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: cmapss_pw
