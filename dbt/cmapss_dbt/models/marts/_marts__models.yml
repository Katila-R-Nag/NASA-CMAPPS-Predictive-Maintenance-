version: 2

models:
  - name: fct_engine_health
    description: "Fleet-level engine health with alert zones. Dashboard reads from this table."
    columns:
      - name: dataset_id
        tests:
          - not_null
      - name: unit_number
        tests:
          - not_null
      - name: time_in_cycles
        tests:
          - not_null
      - name: health_indicator
        description: "1.0 = healthy baseline, approaches 0 as degradation increases"
        tests:
          - not_null
      - name: alert_zone
        tests:
          - not_null
          - accepted_values:
              values: ["healthy", "watch", "critical"]
